[project]
name = "cashdesk-engine"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch>=2.5",
  "torchvision",
  "transformers>=4.57,<6",
  "timm",
  "supervision>=0.25,<0.27",
  "rtmlib",
  "onnxruntime",
  "mlx-vlm; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "opencv-python-headless",
  "numpy",
  "pandas",
  "pyarrow",
  "pillow",
  "openpyxl",
  "fastapi",
  "uvicorn",
  "python-multipart",
  "pytest",
  "huggingface_hub",
  "httpx>=0.28,<1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
