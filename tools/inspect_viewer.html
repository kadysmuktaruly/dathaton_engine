<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detector Inspection</title>
<style>
/* Local review page written by tools/inspect_detections.py. Layout: frame left, controls + boxes right. */
:root {
  --bg: #f4f5f3; --panel: #ffffff; --fg: #1c221f; --muted: #5d6862; --line: #d8dcd8; --accent: #1f6f5c; --chip: #e9ece9; --warn: #b54708;
  --f-ui: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-data: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #121614; --panel: #1a201d; --fg: #e3e8e4; --muted: #94a199; --line: #2c3430; --accent: #5fc4a8; --chip: #232a26; --warn: #f79009; color-scheme: dark } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--f-ui); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
h1 { margin: 0; font-size: 1.35rem; font-weight: 600; }
.sub { color: var(--muted); font-size: .85rem; }
.sub code { font-family: var(--f-data); font-size: .8rem; }
.lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select { font: inherit; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chip small { color: var(--muted); margin-left: 6px; font-family: var(--f-data); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.main { display: grid; grid-template-columns: minmax(0, 460px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }
.frame { position: relative; background: #000; border-radius: 6px; overflow: hidden; }
.frame img { display: block; width: 100%; height: auto; }
.frame svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hud { position: absolute; left: 8px; top: 8px; font: 12px var(--f-data); color: #fff; background: rgba(0,0,0,.6); padding: 2px 6px; border-radius: 3px; }
.empty-tag { position: absolute; right: 8px; top: 8px; font: 12px var(--f-data); color: #000; background: #fdb022; padding: 2px 6px; border-radius: 3px; }
.strip { display: flex; gap: 2px; overflow-x: auto; padding-bottom: 4px; }
.strip button { flex: 0 0 auto; width: 14px; height: 26px; border: 0; border-radius: 2px; cursor: pointer; padding: 0; }
.strip button[aria-current="true"] { outline: 2px solid var(--fg); outline-offset: 1px; }
.nav { display: flex; gap: 8px; align-items: center; font-family: var(--f-data); font-size: .85rem; }
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); overflow: hidden; }
.stat { padding: 8px 12px; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat b { display: block; font: 500 1.35rem var(--f-data); font-variant-numeric: tabular-nums; }
.stat span { font-size: .75rem; color: var(--muted); }
.ctl { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 12px 20px; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; }
.ctl output { font-family: var(--f-data); }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); }
.classes { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; }
.classes label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.list { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); max-height: 24rem; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: .82rem; }
th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--panel); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
td.n { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
tr.dim td { color: var(--muted); }
tr.hl td { background: var(--chip); }
.bar { position: relative; display: inline-block; width: 80px; height: 7px; background: var(--chip); border-radius: 4px; margin-right: 8px; vertical-align: middle; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); }
.note { font-size: .8rem; color: var(--muted); max-width: 90ch; }
:root { --c-true: #d92d20; --c-hit: #12b76a; --c-fa: #f79009; --c-pred: #7a5af8; }
.tag { font-size: .7rem; padding: 0 6px; border-radius: 999px; border: 1px solid currentColor; margin-left: 6px; }
.tag.hit { color: var(--c-hit); } .tag.miss { color: var(--c-true); } .tag.fa { color: var(--c-fa); } .tag.ok { color: var(--muted); }
.chip .code { display: block; font-size: .72rem; color: var(--muted); }
.truth { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.truth .line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .9rem; }
.truth .k { width: 6.5rem; color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
.jump { font: 12px var(--f-data); border: 1px solid currentColor; background: transparent; border-radius: 4px; padding: 1px 7px; cursor: pointer; }
.jump.true { color: var(--c-true); } .jump.pred { color: var(--c-pred); }
.timeline svg { width: 100%; height: 46px; display: block; cursor: pointer; }
.layers { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .88rem; }
.layers label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.reasons { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 8px 12px; font-size: .8rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 4px 16px; }
.reasons h3 { grid-column: 1 / -1; margin: 4px 0 0; font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
.reasons div { display: flex; justify-content: space-between; gap: 8px; }
.reasons b { font-family: var(--f-data); font-weight: 500; }
.prov-explicit { color: var(--c-hit); } .prov-proxy { color: var(--c-fa); }
.near { position: absolute; left: 8px; bottom: 8px; font: 12px var(--f-data); color: #fff; background: var(--c-true); padding: 2px 6px; border-radius: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Detector inspection</h1>
    <div class="sub" id="meta"></div>
  </header>

  <div>
    <div class="row" style="justify-content:space-between"><div class="lbl">Clip</div>
      <div class="row" id="filter" role="group" aria-label="Filter clips">
        <button class="chip" type="button" data-f="all">All</button><button class="chip" type="button" data-f="viol">Labelled violations</button>
        <button class="chip" type="button" data-f="miss">Misses</button><button class="chip" type="button" data-f="fa">False alarms</button>
      </div></div>
    <div class="row" id="clips"></div>
  </div>

  <div class="main">
    <div class="side" style="gap:10px">
      <div class="frame" id="frame"><img id="img" alt=""><svg id="ov" aria-hidden="true"></svg><div class="hud" id="hud"></div><div class="empty-tag" id="emptyTag" hidden>no boxes</div><div class="near" id="near" hidden></div></div>
      <div class="truth" id="truth"></div>
      <div class="timeline"><div class="lbl">Timeline · red = labelled violation, purple = engine alert, line = this frame</div><svg id="tl" aria-hidden="true"></svg></div>
      <div class="nav"><button class="chip" id="prev" type="button">◀ Prev</button><button class="chip" id="next" type="button">Next ▶</button><span id="pos"></span></div>
      <div><div class="lbl">Frames · height = boxes above the cutoff, amber = no detections</div><div class="strip" id="strip"></div></div>
    </div>

    <div class="side">
      <div class="stats" id="stats"></div>
      <div class="ctl">
        <div><label for="objMin">Object cutoff <output id="objOut"></output></label><input type="range" id="objMin" min="0.25" max="0.95" step="0.05"></div>
        <div><label for="perMin">Person cutoff <output id="perOut"></output></label><input type="range" id="perMin" min="0.25" max="0.95" step="0.05"></div>
      </div>
      <div><div class="lbl">Layers</div><div class="layers">
        <label><input type="checkbox" id="lyRaw"> Raw: everything the detector returned (dropped boxes dotted grey)</label>
        <label><input type="checkbox" id="showWeak" checked> Layout-only boxes (dashed)</label>
        <label><input type="checkbox" id="lyTracks" checked> Track ids</label>
        <label><input type="checkbox" id="lyAnchors" checked> Scene anchors + provenance</label>
        <button class="chip" id="reset" type="button">Engine settings</button>
      </div></div>
      <div class="reasons" id="reasons"></div>
      <div><div class="lbl">Classes</div><div class="classes" id="classes"></div></div>
      <div class="list"><table><thead><tr><th>Class</th><th>Role</th><th>Confidence</th><th>Reason</th><th>Track</th><th>Box (cropped px)</th><th>Box (original px)</th></tr></thead><tbody id="rows"></tbody></table></div>
      <p class="note" id="note"></p>
    </div>
  </div>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById('data').textContent);
  const $ = (id) => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const PALETTE = D.colors;
  const color = (c) => PALETTE[c] || '#9e9e9e';
  const st = { clip: 0, frame: 0, obj: D.run.obj_min, per: D.run.person_min, weak: true, hidden: new Set(), hl: -1, filter: 'all',
               raw: false, tracks: true, anchors: true };
  const dropped = (d) => d.reason !== undefined && d.reason !== '' && !d.retained;
  const outcome = (c) => { const t = c.truth; if (!t) return null; return t.labelled ? (t.predicted_flag ? 'hit' : 'miss') : (t.predicted_flag ? 'fa' : 'ok'); };
  const OUT_TEXT = { hit: 'caught', miss: 'missed', fa: 'false alarm', ok: 'clean' };
  const visible = () => D.clips.map((c, i) => i).filter(i => { const o = outcome(D.clips[i]);
    return st.filter === 'all' || (st.filter === 'viol' && (o === 'hit' || o === 'miss')) || o === st.filter; });
  const nearestFrame = (c, t) => c.frames.reduce((b, f, i) => Math.abs(f.actual_t - t) < Math.abs(c.frames[b].actual_t - t) ? i : b, 0);
  const floorOf = (d) => d.cls === 'person' ? st.per : st.obj;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const fmtBox = (b) => b.map(v => Math.round(v)).join(', ');

  $('meta').textContent = '';
  const m = $('meta');
  m.append(document.createTextNode('Detector: '));
  const code = document.createElement('code'); code.textContent = D.run.detector_source; m.appendChild(code);
  m.append(document.createTextNode(` · ${D.run.device} · ${D.run.fps} frame/s sampled · written ${D.run.written}. Local file: keep it off shared drives and chats.`));

  function clipButtons() {
    const box = $('clips'); box.innerHTML = '';
    [...$('filter').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.f === st.filter));
    visible().forEach(i => {
      const c = D.clips[i], o = outcome(c);
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
      b.setAttribute('aria-pressed', i === st.clip);
      b.append(document.createTextNode(c.clip));
      if (o) { const tg = document.createElement('span'); tg.className = 'tag ' + o; tg.textContent = OUT_TEXT[o]; b.appendChild(tg); }
      const code = document.createElement('span'); code.className = 'code';
      code.textContent = c.truth && c.truth.labelled ? c.truth.wanted.join(', ') + ' @ ' + c.truth.label_t.map(t => t + 's').join(', ') : (c.truth ? 'clean clip' : 'no label');
      b.appendChild(code);
      b.onclick = () => { st.clip = i; st.frame = c.truth && c.truth.label_t.length ? nearestFrame(c, c.truth.label_t[0]) : 0; st.hl = -1; render(); };
      box.appendChild(b);
    });
  }

  function classToggles() {
    const all = new Set();
    D.clips.forEach(c => c.frames.forEach(f => f.dets.forEach(d => all.add(d.cls))));
    const box = $('classes'); box.innerHTML = '';
    [...all].sort().forEach(name => {
      const l = document.createElement('label');
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !st.hidden.has(name); cb.id = 'cls-' + name.replace(/\W/g, '_');
      cb.onchange = () => { cb.checked ? st.hidden.delete(name) : st.hidden.add(name); render(); };
      const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = color(name);
      l.append(cb, sw, document.createTextNode(name));
      box.appendChild(l);
    });
  }

  function render() {
    const c = D.clips[st.clip], f = c.frames[st.frame];
    clipButtons();
    renderTruth(c, f);
    $('img').src = f.img; $('img').alt = `${c.clip} at ${f.actual_t.toFixed(2)} s`;
    $('hud').textContent = `${c.clip}  t=${f.actual_t.toFixed(2)}s  #${f.idx}`;
    $('pos').textContent = `frame ${st.frame + 1} / ${c.frames.length}`;
    const dets = f.dets.map((d, i) => ({ ...d, i, rep: !dropped(d) && d.conf >= floorOf(d) }))
      .filter(d => !st.hidden.has(d.cls)).filter(d => st.raw || !dropped(d) || d.i === st.hl);
    $('emptyTag').hidden = f.dets.length > 0;

    // overlay
    const svg = $('ov'); svg.innerHTML = ''; svg.setAttribute('viewBox', `0 0 ${f.w} ${f.h}`);
    const A = c.anchors || {}, P = c.provenance || {};
    if (st.anchors) ['desk', 'machine', 'safe', 'laptop'].forEach(k => {
      const b = A[k]; if (!b) return;
      const prov = P[k] || '', explicit = prov.startsWith('explicit');
      const col = explicit ? 'var(--c-hit)' : 'var(--c-fa)';
      el('rect', { x: b[0], y: b[1], width: b[2] - b[0], height: b[3] - b[1], fill: col, 'fill-opacity': .08, stroke: col, 'stroke-width': 3, 'stroke-dasharray': explicit ? 'none' : '10 5' }, svg);
      const t = el('text', { x: b[0] + 4, y: b[3] - 5, fill: '#fff', stroke: '#000', 'stroke-width': 3, 'paint-order': 'stroke', 'font-size': 12, 'font-family': 'ui-monospace, Menlo, monospace' }, svg);
      t.textContent = `${k.toUpperCase()} (${prov || 'unknown'})`;
    });
    dets.slice().sort((a, b) => a.conf - b.conf).forEach(d => {
      const drop = dropped(d);
      if (!drop && !d.rep && !st.weak && d.i !== st.hl) return;
      const [x0, y0, x1, y1] = d.box, hl = d.i === st.hl, col = drop ? '#9e9e9e' : color(d.cls);
      el('rect', { x: x0, y: y0, width: x1 - x0, height: y1 - y0, fill: hl ? col : 'none', 'fill-opacity': hl ? .25 : 0, stroke: col,
        'stroke-width': hl ? 3.5 : d.rep ? 2.5 : 1.2, 'stroke-dasharray': drop ? '2 3' : d.rep || hl ? 'none' : '6 4' }, svg);
      const tracked = st.tracks && d.cls === 'person' && !drop;
      if (d.rep || hl || tracked) {
        const tid = d.cls === 'person' ? (d.track !== null && d.track !== undefined ? ` #${d.track}` : (d.reason || '').startsWith('untracked') ? ' untracked' : '') : '';
        const txt = `${d.cls}${st.tracks ? tid : ''} ${d.conf.toFixed(2)}`, w = txt.length * 6.2 + 8, ty = y0 > 16 ? y0 - 15 : y0;
        el('rect', { x: x0, y: ty, width: w, height: 15, fill: col }, svg);
        const t = el('text', { x: x0 + 4, y: ty + 11, fill: '#000', 'font-size': 11, 'font-family': 'ui-monospace, Menlo, monospace' }, svg);
        t.textContent = txt;
      }
    });

    // filmstrip
    const strip = $('strip'); strip.innerHTML = '';
    const maxRep = Math.max(1, ...c.frames.map(fr => fr.dets.filter(d => d.conf >= floorOf(d) && !st.hidden.has(d.cls)).length));
    c.frames.forEach((fr, i) => {
      const n = fr.dets.filter(d => d.conf >= floorOf(d) && !st.hidden.has(d.cls)).length;
      const b = document.createElement('button'); b.type = 'button';
      b.title = `${fr.actual_t.toFixed(2)} s · ${n} boxes above cutoff`;
      b.setAttribute('aria-label', b.title);
      b.style.background = fr.dets.length === 0 ? 'var(--warn)' : `color-mix(in srgb, var(--accent) ${20 + 80 * n / maxRep}%, var(--chip))`;
      if (i === st.frame) b.setAttribute('aria-current', 'true');
      b.onclick = () => { st.frame = i; st.hl = -1; render(); };
      strip.appendChild(b);
    });

    // stats for this clip at the current cutoffs
    const allD = c.frames.flatMap(fr => fr.dets);
    const rep = allD.filter(d => d.conf >= floorOf(d));
    const stats = [
      [c.summary.frames, 'frames'], [c.summary.frames_without_detections, 'with no boxes'],
      [allD.length, 'boxes ≥ 0.25'], [rep.length, 'above cutoff'], [c.summary.detect_ms_per_frame + ' ms', 'detect / frame'],
    ];
    const sb = $('stats'); sb.innerHTML = '';
    stats.forEach(([v, k]) => { const d = document.createElement('div'); d.className = 'stat'; const b = document.createElement('b'); b.textContent = v; const s = document.createElement('span'); s.textContent = k; d.append(b, s); sb.appendChild(d); });

    // table
    const tb = $('rows'); tb.innerHTML = '';
    dets.slice().sort((a, b) => b.conf - a.conf).forEach(d => {
      const tr = document.createElement('tr'); if (!d.rep) tr.className = 'dim'; if (d.i === st.hl) tr.classList.add('hl');
      const c1 = document.createElement('td'); const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = color(d.cls); sw.style.marginRight = '6px'; c1.append(sw, document.createTextNode(d.cls));
      const c2 = document.createElement('td'); c2.textContent = d.role || '—';
      const c3 = document.createElement('td'); c3.className = 'n';
      const bar = document.createElement('span'); bar.className = 'bar'; const fi = document.createElement('i'); fi.style.width = (d.conf * 100) + '%'; fi.style.background = color(d.cls);
      const mk = document.createElement('u'); mk.style.left = (floorOf(d) * 100) + '%'; bar.append(fi, mk); c3.append(bar, document.createTextNode(d.conf.toFixed(2)));
      const cr = document.createElement('td'); cr.textContent = d.reason || '—';
      const ct = document.createElement('td'); ct.className = 'n'; ct.textContent = d.track !== null && d.track !== undefined ? '#' + d.track : '—';
      const c4 = document.createElement('td'); c4.className = 'n'; c4.textContent = fmtBox(d.box);
      const c5 = document.createElement('td'); c5.className = 'n'; c5.textContent = fmtBox(d.obox);
      tr.append(c1, c2, c3, cr, ct, c4, c5);
      tr.onmouseenter = () => { st.hl = d.i; render(); };
      tr.onmouseleave = () => { st.hl = -1; render(); };
      tb.appendChild(tr);
    });
    if (!dets.length) { const tr = document.createElement('tr'); const td = document.createElement('td'); td.colSpan = 7; td.textContent = f.dets.length ? 'All boxes in this frame are hidden by the class filter.' : 'The detector returned no boxes for this frame.'; tr.appendChild(td); tb.appendChild(tr); }

    $('objOut').textContent = st.obj.toFixed(2); $('perOut').textContent = st.per.toFixed(2);
    $('objMin').value = st.obj; $('perMin').value = st.per; $('showWeak').checked = st.weak;
    $('lyRaw').checked = st.raw; $('lyTracks').checked = st.tracks; $('lyAnchors').checked = st.anchors;
    renderReasons(c);
  }

  function renderTruth(c, f) {
    const box = $('truth'); box.innerHTML = '';
    const t = c.truth;
    const line = (k, parts) => { const d = document.createElement('div'); d.className = 'line'; const kk = document.createElement('span'); kk.className = 'k'; kk.textContent = k; d.appendChild(kk); parts.forEach(p => d.appendChild(p)); box.appendChild(d); };
    const txt = (s) => document.createTextNode(s);
    const jump = (time, label, cls) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'jump ' + cls; b.textContent = `${label} @ ${time.toFixed(1)}s`; b.onclick = () => { st.frame = nearestFrame(c, time); st.hl = -1; render(); }; return b; };
    if (!t) { line('Label', [txt('No label found for this clip in ' + (D.run.report || 'the report'))]); }
    else {
      line('True', t.labelled ? t.wanted.map((code, i) => jump(t.label_t[i] ?? t.label_t[0] ?? 0, code, 'true')) : [txt('clean clip (no violation)')]);
      line('Engine', t.predicted.length ? t.predicted.map(([pt, code]) => jump(pt, code, 'pred')) : [txt('no alert')]);
      const o = outcome(c); const tg = document.createElement('span'); tg.className = 'tag ' + o; tg.style.marginLeft = '0'; tg.textContent = OUT_TEXT[o];
      line('Result', [tg]);
    }
    // timeline
    const svg = $('tl'); svg.innerHTML = ''; const W = 1000, H = 46, dur = Math.max(c.duration || 0, ...c.frames.map(fr => fr.actual_t), 1);
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('preserveAspectRatio', 'none');
    const x = (tt) => 6 + (W - 12) * tt / dur;
    el('rect', { x: 6, y: 20, width: W - 12, height: 6, rx: 3, fill: 'var(--chip)' }, svg);
    c.frames.forEach(fr => { if (!fr.dets.length) el('rect', { x: x(fr.actual_t) - 2, y: 20, width: 4, height: 6, fill: 'var(--warn)' }, svg); });
    if (t) {
      t.label_t.forEach((lt, i) => { el('rect', { x: x(lt) - 3, y: 4, width: 6, height: 16, fill: 'var(--c-true)' }, svg);
        const tx = el('text', { x: x(lt) + 5, y: 14, 'font-size': 11, fill: 'var(--c-true)', 'font-family': 'ui-monospace, Menlo, monospace' }, svg); tx.textContent = t.wanted[i] || t.wanted[0] || ''; });
      t.predicted.forEach(([pt, code]) => { el('rect', { x: x(pt) - 3, y: 26, width: 6, height: 16, fill: 'var(--c-pred)' }, svg);
        const tx = el('text', { x: x(pt) + 5, y: 40, 'font-size': 11, fill: 'var(--c-pred)', 'font-family': 'ui-monospace, Menlo, monospace' }, svg); tx.textContent = code; });
    }
    el('line', { x1: x(f.actual_t), x2: x(f.actual_t), y1: 0, y2: H, stroke: 'var(--fg)', 'stroke-width': 2 }, svg);
    svg.onclick = (e) => { const r = svg.getBoundingClientRect(); const tt = ((e.clientX - r.left) / r.width * W - 6) / (W - 12) * dur; st.frame = nearestFrame(c, tt); st.hl = -1; render(); };
    // near-label badge on the frame
    const near = $('near'); near.hidden = true;
    if (t && t.labelled) {
      const d = t.label_t.map((lt, i) => [lt - f.actual_t, t.wanted[i] || t.wanted[0]]).sort((a, b) => Math.abs(a[0]) - Math.abs(b[0]))[0];
      if (d && Math.abs(d[0]) <= 3) { near.hidden = false; near.textContent = Math.abs(d[0]) < 0.5 ? `labelled ${d[1]} now` : `labelled ${d[1]} ${d[0] > 0 ? 'in' : ''} ${Math.abs(d[0]).toFixed(1)}s${d[0] < 0 ? ' ago' : ''}`; }
    }
  }

  function renderReasons(c) {
    const box = $('reasons'); box.innerHTML = '';
    const section = (title, obj, fmt) => {
      if (!obj || !Object.keys(obj).length) return;
      const h = document.createElement('h3'); h.textContent = title; box.appendChild(h);
      Object.entries(obj).forEach(([k, v]) => { const d = document.createElement('div'); const a = document.createElement('span'); a.textContent = k;
        const b = document.createElement('b'); b.textContent = fmt ? fmt(v) : v; if (fmt) b.className = String(v).startsWith('explicit') ? 'prov-explicit' : 'prov-proxy'; d.append(a, b); box.appendChild(d); });
    };
    section('Scene anchors (explicit = fine-tuned class, proxy = geometry / look-alike)', c.provenance, v => v || 'not found');
    section('People, all engine frames (Facts.person_log)', c.summary.person_log_all_frames);
    section('Boxes on displayed frames, by reason', c.summary.reasons_on_displayed_frames);
    if (!box.children.length) { const d = document.createElement('div'); d.textContent = 'Run without --detector-only to see reasons, tracks and anchors.'; box.appendChild(d); }
  }

  $('lyRaw').onchange = e => { st.raw = e.target.checked; render(); };
  $('lyTracks').onchange = e => { st.tracks = e.target.checked; render(); };
  $('lyAnchors').onchange = e => { st.anchors = e.target.checked; render(); };

  [...$('filter').children].forEach(b => b.onclick = () => { st.filter = b.dataset.f; const v = visible(); if (v.length && !v.includes(st.clip)) { st.clip = v[0]; st.frame = 0; } render(); });

  $('objMin').oninput = e => { st.obj = Number(e.target.value); render(); };
  $('perMin').oninput = e => { st.per = Number(e.target.value); render(); };
  $('showWeak').onchange = e => { st.weak = e.target.checked; render(); };
  $('reset').onclick = () => { st.obj = D.run.obj_min; st.per = D.run.person_min; render(); };
  const step = (k) => { const n = D.clips[st.clip].frames.length; st.frame = (st.frame + k + n) % n; st.hl = -1; render(); };
  $('prev').onclick = () => step(-1); $('next').onclick = () => step(1);
  document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
  $('note').textContent = `Boxes are the detector's own output (no tracking, no scene logic). Solid = at or above the cutoff the engine uses (objects ${D.run.obj_min}, people ${D.run.person_min}); dashed = between 0.25 and the cutoff. ` +
    `Grey dotted = dropped by the engine (see Reason). Anchor boxes: green solid = explicit class, amber dashed = proxy (a location estimate, not proof of what the object is). Kept classes: ${D.run.kept_classes.join(', ')}. True labels and engine alerts come from ${D.run.report || 'no report'}. A box here is a detection, not proof of a violation.`;

  classToggles(); render();
})();
</script>
</body>
</html>
